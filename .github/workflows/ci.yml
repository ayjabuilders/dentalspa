name: Foundation
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'qa/screenshots/**', 'MANIFEST.sha256']
  pull_request:
    paths-ignore: ['**/*.md', 'qa/screenshots/**', 'MANIFEST.sha256']
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:inquiry-schedule-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-contact-preference-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-communication-language-concurrency
        timeout-minutes: 3
      - run: pnpm db:concurrency
        timeout-minutes: 5
      - run: pnpm db:outbox-concurrency
        timeout-minutes: 5
      - run: pnpm exec supabase db lint --local --level error
      - if: always()
        run: pnpm exec supabase stop
