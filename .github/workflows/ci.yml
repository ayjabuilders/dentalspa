name: Foundation
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'qa/screenshots/**', 'MANIFEST.sha256']
  pull_request:
    paths-ignore: ['**/*.md', 'qa/screenshots/**', 'MANIFEST.sha256']
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publication:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node --no-experimental-require-module apps/dental-api/scripts/check-native-runtime.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
  hosted-build:
    name: Hosted build (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        application: [clinic-os, patient-pass, public-booking]
    env:
      # Compile hosted branches without production credentials or network fixtures.
      # This checks packaging, not connectivity or release acceptance.
      VERCEL: '1'
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://ci-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pwa.mjs
      - run: pnpm exec turbo run build --filter=@dental/${{ matrix.application }}
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:inquiry-schedule-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-contact-preference-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-communication-language-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-communication-time-zone-concurrency
        timeout-minutes: 3
      - run: pnpm db:inquiry-planned-action-concurrency
        timeout-minutes: 3
      - run: pnpm db:concurrency
        timeout-minutes: 5
      - run: pnpm db:outbox-concurrency
        timeout-minutes: 5
      - run: pnpm exec supabase db lint --local --level error
      - if: always()
        run: pnpm exec supabase stop
